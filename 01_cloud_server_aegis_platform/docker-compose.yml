services:
  backend:
    build: ./backend
    container_name: aegis_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
    depends_on:
      - db
      - redis
    volumes:
      - aegis_storage:/app/storage

  frontend:
    build: ./frontend
    container_name: aegis_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: aegis_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - aegis_storage:/var/www/storage
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:15-alpine
    container_name: aegis_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=aegis_db
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: always

volumes:
  aegis_pgdata:
  aegis_storage:
